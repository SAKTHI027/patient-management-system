<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient Booking System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- External CSS Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f5f7fa;
      color: #333;
    }

    /* Login Page */
    .login-container {
      position: fixed;
      top: 0; right: 0;
      width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      transition: transform 0.8s ease-in-out;
      z-index: 10;
    }
    .login-container.hidden {
      transform: translateX(-100%);
    }
    .login-box {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      width: 320px;
      text-align: center;
      animation: fadeInDown 1s;
    }
    .login-box h2 {
      margin-bottom: 1rem;
      color: #4facfe;
    }
    .login-box input {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      transition: border-color 0.3s;
    }
    .login-box input:focus {
      border-color: #4facfe;
      outline: none;
    }
    .login-box button {
      width: 100%;
      padding: 0.8rem;
      background: #4facfe;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .login-box button:hover {
      background: #00c6fb;
      transform: scale(1.05);
    }

    /* Dashboard */
    .dashboard {
      display: none;
      padding: 2rem;
      animation: fadeInRight 1s;
    }
    .nav {
      background: #4facfe;
      padding: 1rem;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 8px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .card {
      background: #fff;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s;
      text-align: center;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card h3 {
      color: #4facfe;
      margin-bottom: 0.5rem;
    }
    .card i {
      font-size: 2rem;
      color: #4facfe;
      margin-bottom: 0.5rem;
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 2rem;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      animation: fadeInUp 1s;
    }
    th, td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background: #4facfe;
      color: #fff;
    }
    tr:hover {
      background: #f9f9f9;
    }
  </style>
</head>
<body>

  <!-- Login Portal -->
  <div class="login-container" id="loginPage">
    <div class="login-box animate__animated animate__fadeInDown">
      <h2><i class="fa-solid fa-user"></i> Patient Login</h2>
      <input type="text" id="patientName" placeholder="Patient Name">
      <input type="text" id="patientNumber" placeholder="Patient Number">
      <button onclick="login()">Login</button>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="nav">
      <h1><i class="fa-solid fa-hospital"></i> Patient Booking System</h1>
      <span id="welcome"></span>
    </div>

    <div class="cards">
      <div class="card animate__animated animate__zoomIn">
        <i class="fa-solid fa-users"></i>
        <h3>Total Patients</h3>
        <p id="totalPatients">0</p>
      </div>
      <div class="card animate__animated animate__zoomIn">
        <i class="fa-solid fa-calendar-check"></i>
        <h3>Upcoming Appointments</h3>
        <p id="upcomingAppointments">0</p>
      </div>
      <div class="card animate__animated animate__zoomIn">
        <i class="fa-solid fa-user-doctor"></i>
        <h3>Doctors Available</h3>
        <p id="doctorsAvailable">0</p>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Patient Name</th>
          <th>Patient Number</th>
          <th>Appointment Date</th>
          <th>Doctor</th>
        </tr>
      </thead>
      <tbody id="patientTable">
        <!-- Dynamic rows -->
      </tbody>
    </table>
  </div>

  <!-- External JS -->
  <script>
    async function login() {
      const name = document.getElementById('patientName').value;
      const number = document.getElementById('patientNumber').value;

      if(name && number) {
        document.getElementById('loginPage').classList.add('hidden');
        setTimeout(() => {
          document.getElementById('dashboard').style.display = 'block';
          document.getElementById('welcome').innerText = `Welcome, ${name}`;
          addPatient(name, number);
          fetchData();
        }, 800);
      } else {
        alert("Please enter both name and number.");
      }
    }

    function addPatient(name, number) {
      const table = document.getElementById('patientTable');
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${name}</td>
        <td>${number}</td>
        <td>${new Date().toLocaleDateString()}</td>
        <td>Dr. Smith</td>
      `;
      table.appendChild(row);

      const total = document.getElementById('totalPatients');
      total.innerText = parseInt(total.innerText) + 1;
    }

    // Mock API call for UX demo
    async function fetchData() {
      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/users');
        const data = await response.json();

        // Simulate appointments and doctors
        document.getElementById('upcomingAppointments').innerText = data.length;
        document.getElementById('doctorsAvailable').innerText = 12;

        // Add some patients from API
        data.slice(0,5).forEach(user => {
          const table = document.getElementById('patientTable');
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${user.name}</td>
            <td>${user.id}</td>
            <td>${new Date().toLocaleDateString()}</td>
            <td>Dr. Adams</td>
          `;
          table.appendChild(row);
        });
      } catch (error) {
        console.error("API fetch failed", error);
      }
    }
  </script>
</body>
</html>
